# Container configuration. Mounted at /app/tokenbiryani.yaml by docker-compose.yml.
#
# The gateway re-reads this file when its mtime changes, so edits here land without
# a restart. Accounts you add from the console are stored in Redis instead and are
# not written back here — the file stays yours.

server:
  host: 0.0.0.0
  port: 8787
  # Binding 0.0.0.0 is the whole point of a container, so this must be true and at
  # least one key must exist — otherwise the gateway refuses to start rather than
  # expose your credentials to the network. Compose publishes to loopback only.
  allow_remote: true

routing:
  strategy: sticky_headroom

store:
  # Shared with any other replica in the compose project, and it outlives the
  # container — which is why TOKENBIRYANI_SECRET_KEY needs to as well.
  backend: redis
  url: redis://redis:6379/0
  # Only used if you switch backend to sqlite. /state is a named volume.
  path: /state/tokenbiryani.db
  secret_key_path: /state/tokenbiryani.key

accounts: []
  # Empty on purpose. Add your first account from the console at
  # http://localhost:8787/console — it is stored encrypted in Redis, not written
  # back here, and can be renamed, tested and rotated in place.
  #
  # Or declare one here, with ANTHROPIC_API_KEY set in your .env:
  #
  # - id: acct-01
  #   name: Production key
  #   type: anthropic_api
  #   api_key: ${ANTHROPIC_API_KEY}

keys:
  - key: ${TOKENBIRYANI_KEY}
    name: default
    # Required to reach /admin/* — the pool, the request inspector, the usage
    # charts and account management. Issue tenant keys without it.
    admin: true

# Costs are reported, and spend caps enforced, only for models that have a price.
# `builtin` is the dated table that ships with this release; the console shows its
# date beside every cost, so a stale number is visible rather than silent. Check
# https://anthropic.com/pricing and override any model by naming it here.
pricing: builtin
