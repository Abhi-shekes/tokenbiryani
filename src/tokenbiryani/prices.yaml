# Bundled price table — USD per million tokens.
#
# This file is DATA, not code, and it is DATED. That distinction is the whole
# argument for shipping it: the project's standing rule is that the gateway must
# never bill against a number nobody can attribute, and a dated table that the
# console displays the date of satisfies that rule. A hard-coded dict in
# config.py would not.
#
# Opt in with `pricing: builtin` in tokenbiryani.yaml. Name a model under
# `pricing:` to override any line here — your entry always wins.
#
# Check the current numbers at https://anthropic.com/pricing and either update
# this file or override in your own config. The console shows `as_of` beside
# every cost so a stale table is visible rather than silent.
#
# cache_read and cache_write are the standard multiples of the input rate:
# a cache read bills at ~0.1x input, a 5-minute cache write at ~1.25x input.
# Claude Fable 5.1 is the exception — its cache reads are priced at a flat
# $0.25/MTok rather than 0.1x — so it is written out rather than derived.

as_of: 2026-06-24
source: https://anthropic.com/pricing

models:
  claude-fable-5-1*:
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write: 12.5

  claude-fable-5*:
    input: 10.0
    output: 50.0
    cache_read: 1.0
    cache_write: 12.5

  claude-opus-5*:
