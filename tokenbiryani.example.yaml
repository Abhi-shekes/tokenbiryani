# tokenbiryani — full configuration reference.
# Every value shown is the default unless noted.

server:
  host: 127.0.0.1
  port: 8787
  # Required to bind anything but loopback. Also requires at least one key below.
  allow_remote: false
  request_timeout_seconds: 600
  # Re-read this file when its mtime changes. 0 disables polling; POST /admin/reload
  # still works either way. A file that fails to parse leaves the running config alone.
  hot_reload_seconds: 5

routing:
  # sticky_headroom | headroom | cost_tiered | priority | least_loaded | round_robin
  strategy: sticky_headroom
  affinity_ttl_seconds: 1800
  # Token estimates are multiplied by this before becoming a lease. Above 1.0 means
  # reserving slightly too much, which is the safe direction.
  estimate_safety_margin: 1.15
  # How the output half of a lease is sized.
  #   adaptive   — predict from what each model has actually been returning, bounded
  #                by the caller's own max_tokens, so it can only ever reserve less
  #   max_tokens — reserve the caller's ceiling, which an agent client sets far above
  #                what it ever receives
  output_estimate: adaptive
  output_estimate_quantile: 0.95      # reserve for the tail, not the median
  output_estimate_min_samples: 20     # below this, the ceiling is used
  output_estimate_window: 200         # completions per model that take part
  output_estimate_floor: 256          # never predict below this
  output_estimate_max_undershoot: 0.20  # beaten more often than this, stop predicting
  weights:
    affinity: 0.40
    headroom: 0.40
    priority: 0.10
    load: 0.15
    errors: 0.20
    cost: 0.10

pacing:
  # Whether the pool is on course to spend its quota window, run dry early, or reach
  # the end of the week with quota unused. Advisory reports and changes nothing.
  enabled: true
  mode: advisory            # advisory | enforcing
  window: 7d                # 5h | 7d — for accounts that report a rolling window
  curve: linear             # linear | business_hours (Mon-Fri 09:00-17:00 UTC)
  ahead_threshold: 0.10
  behind_threshold: 0.10
  # Enforcing holds BATCH-priority requests only, scaled by how far ahead of pace the
  # pool is. Interactive traffic is never delayed to protect a budget.
  max_batch_delay_seconds: 30
  # Required for API-key accounts: they report no weekly window of any kind, so
  # without a stated budget they are simply not paced. Subscriptions report their own
  # 5h and 7d utilisation and need nothing here.
  # weekly_budget_usd: 400

cache:
  # Add a cache_control breakpoint to requests that carry none, at the end of the
  # stable head. OFF by default and best left off: everywhere else this gateway
  # routes rather than rewrites, and this makes it the third exception to that after
  # the two fields Bedrock and Vertex need. Diagnosis (GET /admin/cache-advice) works
  # either way and costs nothing.
  auto_breakpoint: false
  # Requests per (key, model) before the advisor will express an opinion.
  advice_min_requests: 20

retry:
  max_attempts: 3
  max_accounts: 3
  deadline_seconds: 120
  backoff_base_seconds: 0.25
  backoff_max_seconds: 8
  # How long to hold a stream before its first content delta, waiting to see whether it
  # fails. Past this point failover is no longer invisible to the client.
  first_token_grace_seconds: 20

breaker:
  failure_threshold: 5
  cooldown_seconds: 30

queue:
  max_size: 128
  default_max_wait_seconds: 60

batch:
  # Spill lane. When the pool is saturated, batch-priority requests go to the Message
  # Batches API instead of waiting. Cheaper, but asynchronous: the gateway holds the
  # connection while it polls, bounded by that request's wait budget and never longer.
  # A batch that outlives the budget is cancelled and its id returned in
  # x-tokenbiryani-batch-id. Streaming requests never spill; batches do not stream.
  enabled: false
  poll_interval_seconds: 2
  # Applied to computed cost for spilled work. Operator-supplied, like `pricing`.
  cost_multiplier: 0.5

store:
  # memory  — in-process, loses affinity and spend on restart
  # sqlite  — one file; what makes a spend cap mean anything after a restart
  # redis   — shared between instances
  backend: memory
  path: tokenbiryani.db
  # Encryption key for credentials added through the API. Created 0600 on first use.
  # Overridden by TOKENBIRYANI_SECRET_KEY, which is what containers should set.
  secret_key_path: tokenbiryani.key
  url: redis://127.0.0.1:6379/0
  namespace: tokenbiryani

spend:
  # Caps are windowed, not lifetime. A lifetime cap on a persistent store would
  # eventually wedge the gateway shut and stay that way.
  window_hours: 24

observability:
  # Prompts are sensitive. Turning this on logs request bodies.
  log_bodies: false
  event_buffer: 500

# Accounts can also be added at runtime through the console or POST /admin/accounts.
# Those are stored encrypted in the state store; these are governed by this file and
# the API will not edit or delete them.
accounts:
  - id: acct-01
    name: Primary
    type: anthropic_api
    api_key: ${ANTHROPIC_API_KEY}
    # base_url is an override; omit it to use the adapter's own default.
    # base_url: https://api.anthropic.com
    priority: 0.0        # nudge for the `priority` strategy
    cost_tier: 1.0       # relative cost, used by `cost_tiered`
    models: ["*"]        # allowlist; supports trailing wildcards
    max_concurrency: 16
    spend_cap_usd: null  # needs `pricing` below to be enforceable
    enabled: true
    # Set false for an upstream that reports no anthropic-ratelimit-* headers. Such
    # an account would otherwise read as permanently full and win every comparison
    # against accounts that honestly report a partly-used budget. It is scored at
    # assumed_headroom instead, and left out of the capacity horizon.
    observable_limits: true
    assumed_headroom: 0.5

  - id: acct-02
    type: anthropic_api
    api_key: ${ANTHROPIC_API_KEY_2}
    cost_tier: 1.0

  # Bedrock and Vertex accounts share the pool with API keys, so a request can fail
  # over from one to the other. options is untyped and provider-specific.
  # - id: acct-bedrock
  #   type: bedrock              # pip install "tokenbiryani[bedrock]"
  #   cost_tier: 1.2
  #   options:
  #     region: us-east-1
  #     profile: default         # omit for the ambient AWS credential chain
  #     model_map:
  #       claude-test-1: anthropic.claude-3-5-sonnet-20241022-v2:0
  #
  # - id: acct-vertex
  #   type: vertex               # pip install "tokenbiryani[vertex]"
  #   options:
  #     project: my-project
  #     region: us-central1
  #     model_map:
  #       claude-test-1: claude-3-5-sonnet-v2@20241022

# A Claude subscription (type: oauth). Three ways to give it a token — see
# docs/oauth.md — and only the third needs the `oauth:` block below.
#
#   - id: claude-code
#     name: Claude Code (Pro)
#     type: oauth
#     options:
#       # 1. This machine's Claude Code login. The gateway reads the token the CLI
#       #    wrote and re-reads it whenever the CLI refreshes it. Name the profile
#       #    you actually sign in with: CLAUDE_CONFIG_DIR points the CLI elsewhere,
#       #    and ~/.claude is then a different account. The console's Add-account
#       #    dialog scans for these and shows which is current.
#       credentials_path: ~/.claude/.credentials.json
#       # 2. A long-lived token from `claude setup-token`. Prefer adding this from
#       #    the console, which encrypts it; a token written here is plaintext.
#       # access_token: ${CLAUDE_OAUTH_TOKEN}
#       # token_env: CLAUDE_OAUTH_TOKEN
#       # Unverified default; set it if the gateway logs a 4xx naming a beta flag.
#       # beta_header: oauth-2025-04-20
#
# A subscription reports rolling-window utilisation rather than per-window budgets,
# so it keeps headroom routing and failover but has no binding leases, no admission
# control and no capacity horizon. observable_limits is forced false for it.
#
# 3. The login the gateway runs itself — what pooling several subscriptions needs.
# Empty by default and the login refuses until all three are set. Anthropic does not
# publish the OAuth endpoints its first-party clients use, so this project will not
# guess: a wrong value hard-coded here would look like a working feature.
# oauth:
#   client_id: ""
#   authorize_url: ""
#   token_url: ""
#   # Blank = the provider shows a code and you paste it into the console. Set it to
#   # http://127.0.0.1:8787/admin/oauth/callback if you can register a callback.
#   redirect_uri: ""
#   scopes: []
#   refresh_skew_seconds: 300      # renew this far ahead of expiry
#   refresh_interval_seconds: 60   # how often sessions are checked

keys:
  - key: ${TOKENBIRYANI_KEY}
    name: default
    models: ["*"]
    pool: []             # empty means every account
    rpm: null
    spend_cap_usd: null
    # Required to reach /admin/* — pool snapshot, request inspector, key management.
    # Issue tenant keys without it: /admin exposes account ids and spend.
    admin: false
    # interactive | batch — batch yields the queue when the pool is saturated
    priority: interactive
    # Seconds this key's requests wait for capacity. Null falls back to
    # queue.default_max_wait_seconds. A client's X-TokenBiryani-Max-Wait header can
    # shorten this but never extend it.
    max_wait_seconds: null

# USD per million tokens. Operator-supplied on purpose: the gateway ships no price list,
# so it can never bill you against numbers that went stale in a release.
# pricing:
#   claude-opus-4-*:
#     input: 15.0
#     output: 75.0
#     cache_read: 1.5
#     cache_write: 18.75
