[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenbiryani"
version = "0.1.0"
description = "A pooling gateway for Claude accounts: routes on live rate-limit headers, keeps prompt caches warm, fails over without dropping a stream."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["claude", "anthropic", "gateway", "proxy", "rate-limit", "load-balancing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "httpx>=0.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "ruff>=0.1", "redis>=5.0", "fakeredis>=2.20"]

[project.scripts]
tokenbiryani = "tokenbiryani.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/tokenbiryani"
Issues = "https://github.com/OWNER/tokenbiryani/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenbiryani"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP007", "UP035", "UP045"]
