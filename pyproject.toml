[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenbiryani"
version = "0.1.0"
description = "A pooling gateway for Claude accounts: routes on live rate-limit headers, keeps prompt caches warm, fails over without dropping a stream."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["claude", "anthropic", "gateway", "proxy", "rate-limit", "load-balancing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "httpx>=0.24",
  "pyyaml>=6.0",
  # Not an extra. Accounts added from the console are encrypted before they reach
  # the store, and the console is the documented way to add an account — so a
  # default install that cannot encrypt cannot complete the primary path.
  "cryptography>=41.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
# Kept as an empty extra so existing `pip install 'tokenbiryani[secrets]'` lines
# keep resolving; cryptography moved into the base dependencies.
secrets = []
bedrock = ["botocore>=1.31"]
vertex = ["google-auth>=2.20"]
all = ["redis>=5.0", "botocore>=1.31", "google-auth>=2.20"]
# Pinned below MkDocs 2.0, which drops the plugin and theming systems this site uses.
docs = ["mkdocs-material>=9.5,<10"]
dev = [
  "pytest>=7.4", "pytest-asyncio>=0.21", "pytest-cov>=4.1", "ruff>=0.1",
  "mypy>=1.8", "types-PyYAML",
  "redis>=5.0", "fakeredis>=2.20", "botocore>=1.31", "google-auth>=2.20",
  "playwright>=1.40",
  # `serve --reload` falls back to polling without this; with it, inotify.
  "watchfiles>=0.21",
]

[project.scripts]
tokenbiryani = "tokenbiryani.cli:main"

# Set these when the project has a home. Shipping links to a repository that does
# not exist is worse than shipping none.
# [project.urls]
# Homepage = "https://github.com/<owner>/tokenbiryani"
# Issues = "https://github.com/<owner>/tokenbiryani/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenbiryani"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.8"
# tests/support is the fake upstream. It left src/ so it would stop shipping to
# users, but it is still 600-odd lines the whole suite depends on, so it keeps its
# type checking rather than falling off the edge of the config.
files = ["src/tokenbiryani", "tests/support"]
mypy_path = "tests"
ignore_missing_imports = true
# Not strict: the point is to catch Optional handling that would crash at runtime,
# not to annotate every local. Raise this as the code settles.
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP007", "UP035", "UP045"]
