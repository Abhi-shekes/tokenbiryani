site_name: tokenbiryani
site_description: A pooling gateway for Claude accounts.
site_url: https://abhi-shekes.github.io/tokenbiryani/
repo_url: https://github.com/Abhi-shekes/tokenbiryani
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle: { icon: material/weather-night, name: Dark }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Why is my bill higher?: caching.md
  - Routing: routing.md
  - Spending the week on purpose: pacing.md
  - Streaming and retries: streaming.md
  - Configuration: configuration.md
  - Account types: providers.md
  - Subscription accounts: oauth.md
  - Usage and charts: usage.md
  - Operating: operating.md
  - Deployment: deployment.md
  - Extending: extending.md
  - Console design: UI-DESIGN.md
  - Onboarding plan: UX-PLAN.md
  - Decisions:
      - Sticky affinity by default: adr/0001-sticky-affinity-by-default.md
      - Error taxonomy: adr/0002-error-taxonomy.md
      - API keys only: adr/0003-api-keys-only.md
      - Subscription login in core: adr/0004-subscription-login-in-core.md
