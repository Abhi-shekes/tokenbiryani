[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenbiryani-oauth"
version = "0.1.0"
description = "Subscription-session account type for the tokenbiryani gateway. Read the README before installing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["tokenbiryani>=0.1.0", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "ruff>=0.1"]

# This is the whole integration: installing the package makes `type: oauth` valid.
[project.entry-points."tokenbiryani.providers"]
oauth = "tokenbiryani_oauth:OAuthUpstream"

[project.scripts]
tokenbiryani-oauth-check = "tokenbiryani_oauth.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenbiryani_oauth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP007", "UP035", "UP045"]
