[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenbiryani-oauth"
version = "0.1.0"
description = "Deprecated: `type: oauth` is built into tokenbiryani >= 0.1.0. Kept as a compatibility shim."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["tokenbiryani>=0.1.0", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "ruff>=0.1"]

# No entry point any more. `oauth` became a built-in account type in core, and a
# plugin may not shadow a built-in — registering it would raise on every startup.
# Existing `type: oauth` config keeps working; core reads the same options.

[project.scripts]
tokenbiryani-oauth-check = "tokenbiryani_oauth.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenbiryani_oauth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP007", "UP035", "UP045"]
